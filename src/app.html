<title>İlim Meydanı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: tek sütunlu oyun kabuğu. Tezhip paleti: lacivert zemin, altın varak ince çizgiler, fildişi yazı; turkuaz oyuncu, mercan rakip. */
:root{
  --bg:#0a1230; --bg2:#111c42; --surface:#141f48; --surface2:#1d2b5c; --line:#2a396c; --hair:rgba(217,181,106,.32);
  --ink:#f4efe2; --muted:#a3adc9; --gold:#d9b56a; --gold-soft:#332c22;
  --turq:#58cfc6; --turq-soft:#123a47; --coral:#f08268; --coral-soft:#45232f; --ok:#62d29c; --ok-soft:#133d38;
  --cta:#d9b56a; --on-cta:#17120a; --on-fill:#0a1230; --shade:rgba(4,8,22,.74); --shadow:0 22px 44px -22px rgba(0,0,0,.7);
  --display:"Gilda Display","Palatino Linotype","Book Antiqua",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f8; --bg2:#ffffff; --surface:#ffffff; --surface2:#e9ecf5; --line:#d7dcea; --hair:rgba(150,113,31,.4);
  --ink:#131c40; --muted:#5a6486; --gold:#8f6b1c; --gold-soft:#f4ecd6;
  --turq:#0b8482; --turq-soft:#daf0ee; --coral:#c2412b; --coral-soft:#fae1da; --ok:#1b8553; --ok-soft:#dcf2e6;
  --cta:#18286a; --on-cta:#ffffff; --on-fill:#ffffff; --shade:rgba(19,28,64,.5); --shadow:0 18px 36px -22px rgba(19,28,64,.45);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f8; --bg2:#ffffff; --surface:#ffffff; --surface2:#e9ecf5; --line:#d7dcea; --hair:rgba(150,113,31,.4);
  --ink:#131c40; --muted:#5a6486; --gold:#8f6b1c; --gold-soft:#f4ecd6;
  --turq:#0b8482; --turq-soft:#daf0ee; --coral:#c2412b; --coral-soft:#fae1da; --ok:#1b8553; --ok-soft:#dcf2e6;
  --cta:#18286a; --on-cta:#ffffff; --on-fill:#ffffff; --shade:rgba(19,28,64,.5); --shadow:0 18px 36px -22px rgba(19,28,64,.45);
  color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(130% 55% at 50% -12%,var(--bg2),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:500 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;-webkit-font-smoothing:antialiased}
#app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .12s ease,border-color .15s ease,background-color .15s ease}
button:active:not(:disabled){transform:scale(.975)}
button:disabled{cursor:default;opacity:.38}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:400 28px/1.12 var(--display);letter-spacing:.005em}
h2{font:700 11px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.lede{color:var(--muted);max-width:42ch}
.eyebrow{font:700 10.5px/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* sekiz köşeli yıldız */
.star{position:relative;width:1em;height:1em;display:inline-block;flex:none}
.star::before,.star::after{content:"";position:absolute;inset:15%;background:currentColor}
.star::after{transform:rotate(45deg)}
.medal{position:relative;width:38px;height:38px;display:grid;place-items:center;flex:none;color:var(--gold)}
.medal::before,.medal::after{content:"";position:absolute;inset:6px;border:1.5px solid currentColor;background:var(--surface)}
.medal::after{transform:rotate(45deg)}
.medal i{position:relative;z-index:1;font:800 12.5px/1 var(--body);font-style:normal;color:var(--ink)}
.medal.me{color:var(--turq)}.medal.bot{color:var(--coral)}
.medal.big{width:92px;height:92px}.medal.big::before,.medal.big::after{inset:15px;border-width:2px}.medal.big i{font:400 30px/1 var(--display)}

/* ana ekran */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:400 23px/1 var(--display);letter-spacing:.01em}
.lp{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);border-radius:999px;padding:7px 13px 7px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.lp .star{color:var(--gold);font-size:14px}.lp b{color:var(--ink);font-weight:800}
.rankbar{display:grid;gap:7px}
.rankbar>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.rankbar>div:first-child span:first-child{color:var(--ink);font-weight:700}
.rankbar .bar{height:3px;flex:none}.rankbar .bar i{background:var(--gold);min-width:3px}
.hero{position:relative;overflow:hidden;display:grid;gap:10px;justify-items:start;text-align:left;width:100%;padding:24px 20px 20px;border-radius:26px;
  background:linear-gradient(155deg,var(--surface2),var(--surface) 70%);border:1px solid var(--hair);box-shadow:var(--shadow)}
.pat{position:absolute;inset:0;width:100%;height:100%;color:var(--gold);opacity:.22;pointer-events:none;
  -webkit-mask-image:linear-gradient(105deg,transparent 38%,#000);mask-image:linear-gradient(105deg,transparent 38%,#000)}
.hero>*:not(.pat){position:relative}
.hero h1{font-size:31px;max-width:13ch}
.hero p{color:var(--muted);max-width:27ch;font-size:14px}
.cta{background:var(--cta);color:var(--on-cta);border-radius:999px;padding:10px 20px;font-weight:800;font-size:14px;margin-top:6px}
.word{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.word .wt{display:flex;gap:3px}.word .wt i{width:15px;height:19px;border-radius:4px;border:1.5px solid var(--line)}
.word .wt i.ok{background:var(--ok);border-color:var(--ok)}.word .wt i.mid{background:var(--gold);border-color:var(--gold)}
.word b,.rowcard b{display:block;font-weight:700;line-height:1.25}
.word small,.rowcard small{color:var(--muted);font-size:12.5px}
.chev{color:var(--muted);font-size:20px;line-height:1}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.sec span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mt{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:16px;min-height:104px;min-width:0;padding:14px 12px 12px;border-radius:18px;text-align:left;
  background:var(--surface);border:1px solid var(--line)}
.mt:hover,.word:hover,.rowcard:hover{border-color:var(--hair)}
.mt svg,.rowcard svg,.mi svg,.word>svg{width:26px;height:26px;color:var(--gold);flex:none}
.mt b{font:700 13px/1.2 var(--body);overflow-wrap:anywhere}
.mt.lead{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:0;padding:16px;border-color:var(--hair)}
.mt.lead b{font:400 20px/1.15 var(--display)}.mt.lead small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}.mt.lead .chev{margin-left:auto}
.rowcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.rowcard .stat{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.rowcard .stat b{font:400 26px/1 var(--display)}
.note{color:var(--muted);font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* maç üstü */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.vs .p{display:flex;align-items:center;gap:8px;min-width:0}
.vs .p.r{justify-content:flex-end;text-align:right}
.vs .p b{display:block;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.vs .p small{color:var(--muted);font-size:11.5px}
.vs .sc{display:flex;align-items:center;gap:12px;font:400 34px/1 var(--display)}
.vs .sc .a{color:var(--turq)}.vs .sc .b{color:var(--coral)}
.vs .sc em{width:1px;height:24px;background:var(--hair);font-size:0}
.clock{display:flex;align-items:center;gap:12px}
.clock span{font-weight:800;font-size:13px;min-width:44px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:2px;background:var(--ok);transition:width .1s linear}
.bar i[data-low="1"]{background:var(--coral)}
.turn{text-align:center;font-weight:700;font-size:14px}
.turn.me{color:var(--turq)}.turn.bot{color:var(--coral)}

/* soru kutusu */
.qbox{position:relative;padding:22px 16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-align:center}
.qbox::before{content:"";position:absolute;top:-4.5px;left:50%;width:8px;height:8px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}
.qbox small{display:block;font:700 10.5px/1.45 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.qbox b{font:400 21px/1.28 var(--display)}
.qbox .ctx{display:inline-block;margin-bottom:10px;border:1px solid var(--hair);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.stmt{margin-top:10px;font-weight:600;color:var(--muted)}

/* ızgara */
.grid{display:grid;grid-template-columns:.95fr repeat(3,1fr);gap:6px;padding:8px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.hd{display:grid;place-items:center;text-align:center;font-size:10.5px;font-weight:700;line-height:1.25;padding:6px 2px;min-height:58px;color:var(--muted);overflow-wrap:anywhere}
.corner{display:grid;place-items:center;color:var(--gold);font-size:22px;opacity:.7}
.cell{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;
  font-size:12px;font-weight:700;text-align:center;line-height:1.15;overflow-wrap:anywhere;min-width:0}
.cell:hover:not(:disabled){border-color:var(--hair)}
.cell .plus{font-size:20px;color:var(--muted);font-weight:300}
.cell.me{border-color:var(--turq);background:var(--turq-soft)}
.cell.bot{border-color:var(--coral);background:var(--coral-soft)}
.cell.me .star{color:var(--turq);font-size:15px}
.cell.bot .dot{width:11px;height:11px;border-radius:50%;background:var(--coral)}
.cell.target{outline:2px dashed var(--gold);outline-offset:1px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgrid .cell{aspect-ratio:auto;min-height:84px;background:var(--surface)}
.bgrid .cell.me{background:var(--turq-soft)}
.bgrid .cell small{color:var(--turq);font-size:11.5px}

/* jokerler ve düğmeler */
.jok{display:flex;gap:8px}
.jk{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.jk small{font-weight:600;color:var(--muted);font-size:11px}
.jk.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.quit{align-self:center;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:8px}
.btn{background:var(--cta);color:var(--on-cta);border-radius:14px;padding:13px 16px;font-weight:800;text-align:center}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.dy{flex:1;padding:20px;font-size:17px}.btn.yes{background:var(--ok);color:var(--on-fill)}.btn.nay{background:var(--coral);color:var(--on-fill)}
.row{display:flex;gap:8px}.row .inp{flex:1;min-width:0}.row .btn{flex:none}

/* katmanlar */
.overlay{position:fixed;inset:0;background:var(--shade);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;z-index:20;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));overflow:auto;animation:fade .2s both}
.sheet{background:var(--surface);border:1px solid var(--hair);border-radius:26px;padding:20px;width:100%;max-width:408px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;align-items:center;gap:12px}
.sheet-h b{flex:1;font:400 22px/1.15 var(--display)}
.mi{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--hair);flex:none}
.x{font-size:22px;line-height:1;color:var(--muted);padding:4px 8px}
.sheet input,.inp{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sheet input::placeholder,.inp::placeholder{color:var(--muted)}
#res{display:flex;flex-direction:column;gap:6px;min-height:120px}
.hint{color:var(--muted);font-size:13px}
#res .hint{padding:10px 2px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:600}
.sheet .opt{background:var(--bg)}
.opt:hover:not(:disabled){border-color:var(--hair)}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt.no{border-color:var(--coral);background:var(--coral-soft);opacity:1}
.opt.gone{visibility:hidden}
.opt:disabled{opacity:.6}.opt.ok:disabled,.opt.no:disabled{opacity:1}
.opt small{color:var(--muted);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.rules{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:76px 1fr;gap:12px;font-size:13.5px;padding:10px 0;border-top:1px solid var(--line)}
.rules li b{font:700 10.5px/1.6 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.topics.one{grid-template-columns:1fr}
.topics .btn:last-child:nth-child(odd){grid-column:1/-1}
.center{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:90px 0 60px}
.center .pat{-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent);opacity:.3}
.center>*:not(.pat){position:relative}
.center .medal{animation:turnmedal 6s linear infinite}.center .medal i{animation:turnmedal 6s linear infinite reverse}
@keyframes turnmedal{to{transform:rotate(360deg)}}
.out{font:400 32px/1.1 var(--display)}
.out.w{color:var(--ok)}.out.l{color:var(--coral)}
.delta{font-weight:800;font-size:13.5px;border:1px solid var(--hair);border-radius:12px;padding:10px;text-align:center}
.share{margin:0;background:var(--bg);border-radius:14px;padding:12px;font:14px/1.35 var(--body);white-space:pre-wrap;user-select:all;text-align:center}

/* kartlar */
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pool,.hand.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.card{aspect-ratio:3/4;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:5px;
  font-size:11.5px;font-weight:700;text-align:center;line-height:1.18;overflow-wrap:break-word;min-width:0}
.pool .card,.hand.mine .card{aspect-ratio:auto;min-height:76px;font-size:13px}
button.card:hover:not(:disabled){border-color:var(--hair)}
.card .star{font-size:13px;color:var(--gold)}
.card small{color:var(--gold);font-size:11px}
.card.sel{border-color:var(--turq);background:var(--turq-soft)}
.card.back{background:var(--surface2);border-color:var(--hair)}
.card.back .star{font-size:18px}
.card.used{visibility:hidden}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:250px;margin:0 auto;width:100%;min-height:150px}
.arena .slot{display:flex;flex-direction:column;gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.arena .card{font-size:13.5px;border-color:var(--hair)}
.arena .card.win{border-color:var(--ok);background:var(--ok-soft)}
.arena .card.lose{opacity:.5}
.arena .card small{font-size:12px}

/* sıralama, etiketler, sütunlar */
.lb{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.lb div{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:7px 12px;font-size:13px;font-weight:600;border-top:1px solid var(--line)}
.lb div:first-child{border-top:0}.lb div span:first-child{color:var(--muted)}
.lb div.me{color:var(--turq);background:var(--turq-soft);font-weight:800}
.clues{margin:0;padding:0 0 0 24px;display:flex;flex-direction:column;gap:8px;font-weight:600}
.clues li::marker{color:var(--gold);font-weight:800}
.chips,.ring{display:flex;flex-wrap:wrap;gap:6px;min-height:32px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}
.chip.me,.chip.ok{border-color:var(--turq);background:var(--turq-soft)}
.chip.bot,.chip.no{border-color:var(--coral);background:var(--coral-soft)}
.ring{justify-content:center}.ring .chip{width:32px;height:32px;padding:0;display:grid;place-items:center}
.ring .chip.cur{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cols.three{grid-template-columns:repeat(3,1fr);gap:8px}
.cols>div{min-width:0}.cols .ln{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.cols h2{margin-bottom:6px}
.cols.three .qbox b{font-size:24px}
.cols.three .qbox{padding:14px 6px 12px}.cols.three .qbox::before{display:none}
.pairs{display:grid;grid-template-columns:.8fr 1.2fr;gap:8px}.pairs>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.pairs .opt{min-height:60px;font-size:13px;line-height:1.3}
.pairs>div:first-child .opt{font:400 17px/1.2 var(--display)}

/* harita */
#map{width:100%;max-width:330px;margin:0 auto;display:block;cursor:crosshair;touch-action:manipulation;border-radius:16px;border:1px solid var(--line)}
#map .sea{fill:var(--bg)}#map .land{fill:var(--surface2);stroke:var(--hair);stroke-width:1}
#map .lbl{fill:var(--muted);font:600 11px var(--body);pointer-events:none}#map .lbl.on{fill:var(--ink);font-size:13px;font-weight:800;paint-order:stroke;stroke:var(--surface2);stroke-width:4px}
#map .pme{fill:var(--turq);stroke:var(--bg);stroke-width:2}#map .pbot{fill:var(--coral);stroke:var(--bg);stroke-width:2}#map .ptrue{fill:var(--gold);stroke:var(--ink);stroke-width:2}

/* kelime */
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:264px;width:100%;margin:0 auto}
.tile{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;font:800 23px/1 var(--body);background:var(--surface)}
.tile.ok,.key.ok{background:var(--ok);border-color:var(--ok);color:var(--on-fill)}
.tile.mid,.key.mid{background:var(--gold);border-color:var(--gold);color:var(--on-fill)}
.tile.x,.key.x{background:var(--surface2);border-color:var(--surface2);color:var(--muted)}
.kb{display:flex;flex-direction:column;gap:6px}.kb>div{display:flex;gap:4px;justify-content:center}
.key{flex:1;max-width:38px;min-width:0;height:48px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:15px;padding:0}

const staticQ = ([t, c, ...w]) => { const o = shuffle([c, ...w]); return { t, opts: o.map(l => ({ l })), c: o.indexOf(c) }; };

/* ---------- Izgara ---------- */
function makeBoard(deck) {
  for (let n = 0; n < 5000; n++) {
    const c = shuffle(deck.crit).slice(0, 6), rows = c.slice(0, 3), cols = c.slice(3);
    const sets = []; for (const r of rows) for (const k of cols) sets.push(deck.ents.filter(e => r.t(e) && k.t(e)));
    if (sets.some(s => s.length < deck.min || s.length > deck.ents.length * .45)) continue;
    const used = new Set(); const go = i => i === 9 || sets[i].some(e => !used.has(e.id) && (used.add(e.id), go(i + 1) || (used.delete(e.id), false)));
    if (go(0)) return { rows, cols };
  }
}
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttStart() { const deck = DECKS[G.topic]; Object.assign(G, makeBoard(deck), { deck, cells: Array.from({ length: 9 }, () => ({})), used: new Set(), turns: 0, jk: { hint: 3, time: 3, steal: 3 }, steal: false, sel: null }); tttTurn('me'); }
const tttCount = w => G.cells.filter(c => c.o === w).length;
const tttValid = i => { const r = G.rows[Math.floor(i / 3)], c = G.cols[i % 3]; return G.deck.ents.filter(e => r.t(e) && c.t(e) && !G.used.has(e.id)); };
function tttRender() {
  const me = G.turn === 'me';
  app.innerHTML = vsH(tttCount('me'), tttCount('bot')) + clockH() + `<p class="turn ${G.turn}">${me ? (G.steal ? 'Almak istediğin rakip karesine dokun' : 'Sıra sende') : 'Sıra rakipte'}</p>
  <div class="grid"><div class="corner"><span class="star"></span></div>${G.cols.map(c => `<div class="hd">${c.l}</div>`).join('')}
  ${G.rows.map((r, ri) => `<div class="hd">${r.l}</div>` + [0, 1, 2].map(ci => { const i = ri * 3 + ci, c = G.cells[i];
    const can = me && (G.steal ? c.o === 'bot' : !c.o);
    return `<button class="cell ${c.o || ''} ${G.steal && c.o === 'bot' ? 'target' : ''}" data-act="cell" data-i="${i}" ${can ? '' : 'disabled style="opacity:1"'} aria-label="${r.l}, ${G.cols[ci].l}">${c.o ? (c.o === 'me' ? '<span class="star"></span>' : '<span class="dot"></span>') + c.e.name : '<span class="plus">+</span>'}</button>`; }).join('')).join('')}</div>
  <div class="jok"><button class="jk" data-act="jtime" ${me && G.jk.time ? '' : 'disabled'}>Süre<small>+15 sn · ${G.jk.time} hak</small></button>
  <button class="jk ${G.steal ? 'on' : ''}" data-act="jsteal" ${me && G.jk.steal && tttCount('bot') ? '' : 'disabled'}>Çal<small>rakip karesi · ${G.jk.steal} hak</small></button></div>
  <button class="quit" data-act="quit">Maçtan çekil</button>`;
  paintTime();
}
function tttTurn(who) {
  G.turn = who; G.steal = false; G.sel = null; G.turns++;
  const w = ['me', 'bot'].find(o => LINES.some(l => l.every(i => G.cells[i].o === o)));
  if (w || G.cells.every(c => c.o) || G.turns > 30) { tttRender(); stopClock(); return w ? duel(w === 'me' ? 1 : 0, w === 'me' ? 0 : 1) : duel(tttCount('me'), tttCount('bot')); }
  tttRender();
  if (who === 'me') countdown(25, () => { toast('Süre doldu, sıra geçti'); tttTurn('bot'); });
  else { countdown(25); later(tttBot, 1600 + rnd(2400)); }
}
function tttBot() {
  const free = [...G.cells.keys()].filter(i => !G.cells[i].o);
  const want = o => free.find(i => LINES.some(l => l.includes(i) && l.every(j => j === i || G.cells[j].o === o)));
  const i = want('bot') ?? want('me') ?? pick(free), v = tttValid(i);
  if (v.length && Math.random() < .7) { const e = pick(v); G.cells[i] = { o: 'bot', e }; G.used.add(e.id); } else toast(G.opp + ' yanlış cevap verdi');

}

    const m = s ? G.deck.ents.filter(e => hit(e, q.value)).slice(0, 7) : [];
    $('#res').innerHTML = !s ? '<p class="hint">Aramak için yazmaya başla.</p>' : m.length ? resH(m) : '<p class="hint">Sonuç yok.</p>'; }); }
const resH = m => m.map(e => `<button class="opt" data-act="pick" data-id="${e.id}" ${G.used.has(e.id) ? 'disabled' : ''}>${e.name}${G.used.has(e.id) ? '<small>kullanıldı</small>' : ''}</button>`).join('');
function tttPick(id) { const i = G.sel, e = G.deck.ents.find(x => x.id === id), ok = tttValid(i).includes(e), steal = G.steal;
  if (steal) G.jk.steal--;
  if (ok) { G.cells[i] = { o: 'me', e }; G.used.add(e.id); if (steal) toast('Kare artık senin'); } else toast('Yanlış cevap: ' + e.name);
  tttTurn('bot'); }

const cardH = (e, cls = '', extra = '', attr = '') => `<button class="card ${cls}" ${attr}><span class="star"></span>${e.name}${extra}</button>`;

  <button class="jk" data-act="spas" ${G.jk.pas ? '' : 'disabled'}>Pas<small>ölçütü değiştir · ${G.jk.pas} hak</small></button></div>` + quitH; paintTime(); bindSearch(); }
function seckiEnd() { const g = G.goal, mx = Math.max(...G.deck.ents.map(e => e[g.k])), val = e => e ? e[g.k] : g.d > 0 ? 0 : mx, sum = a => a.reduce((s, e) => s + val(e), 0);
  const col = (n, a) => `<div><h2>${n} · ${g.f(sum(a))}</h2>${a.map(e => `<div class="ln"><span>${e ? e.name : 'boş'}</span><span class="num">${val(e)}</span></div>`).join('')}</div>`;
  seckiRender(); stopClock(); duel(sum(G.mine) * g.d, sum(G.theirs) * g.d, `<p class="hint">${g.g}.</p><div class="cols">${col('Sen', G.mine)}${col(G.opp, G.theirs)}</div>`); }

/* ---------- Ben Kimim ---------- */
function kimStart() { const deck = DECKS[G.topic]; Object.assign(G, { deck, used: new Set(), sc: [0, 0], round: 0, onPick: kimPick }); kimRound(); }
function kimRound() { if (G.round === 3) return duel(G.sc[0], G.sc[1]); G.round++; G.e = pick(G.deck.ents.filter(e => e !== G.e)); G.clues = G.deck.clues(G.e); G.i = -1; G.done = null; G.botAt = Math.random() < .15 ? 9 : 1 + rnd(4); kimNext(); }
function kimNext() { if (G.i === 4) return kimEnd(false); G.i++; G.tried = false; kimRender(); countdown(10, kimNext); }
function kimPick(e) { if (e === G.e) return kimEnd(true); G.tried = true; toast('Yanlış tahmin: ' + e.name); kimRender(); }
function kimEnd(ok) { stopClock(); const mp = ok ? 5 - G.i : 0, bp = G.botAt < 5 ? 5 - G.botAt : 0; G.sc[0] += mp; G.sc[1] += bp; G.done = { mp, bp }; kimRender(); later(kimRound, 3400); }
function kimRender() { const d = G.done, keep = !d && !G.tried && $('#q') ? $('#q').value : '';
  app.innerHTML = vsH(G.sc[0], G.sc[1]) + clockH() + `<div class="qbox"><small>${G.round}. TUR · ŞİMDİ BİLİRSEN ${5 - G.i} PUAN</small><b>Ben kimim?</b></div>
  <ol class="clues">${G.clues.slice(0, G.i + 1).map(c => `<li>${c}</li>`).join('')}</ol>` +
  (d ? `<div class="qbox"><small>CEVAP</small><b>${G.e.name}</b></div><p class="turn ${d.mp >= d.bp ? 'me' : 'bot'}">Sen +${d.mp} · ${G.opp} +${d.bp}${G.botAt < 5 ? ` (${G.botAt + 1}. ipucunda bildi)` : ' (bilemedi)'}</p>`
    : G.tried ? '<p class="hint">Bu ipucunda tahmin hakkın bitti, sonrakini bekle.</p>' : searchH(G.deck.ph)) + quitH;
  paintTime(); bindSearch(); if (keep) { $('#q').value = keep; $('#q').dispatchEvent(new Event('input')); } }

/* ---------- Pingpong ---------- */
function pingStart() { const deck = DECKS[G.topic]; Object.assign(G, { deck, sc: [0, 0], server: 'bot', onPick: pingPick }); pingServe(); }
function pingServe() { if (G.sc[0] === 3 || G.sc[1] === 3) return duel(G.sc[0], G.sc[1]); G.server = G.server === 'me' ? 'bot' : 'me';
  G.crit = pick(G.deck.crit.filter(c => c !== G.crit && G.deck.ents.filter(e => c.t(e)).length >= G.deck.min * 4)); G.used = new Set(); G.rally = []; pingTurn(G.server); }
function pingTurn(w) { G.turn = w; pingRender();
  if (w === 'me') countdown(12, () => pingPoint('bot', 'Süre doldu'));
  else { countdown(12); later(() => { const v = G.deck.ents.filter(e => G.crit.t(e) && !G.used.has(e.id));
    if (v.length && Math.random() < Math.max(.4, .92 - G.rally.length * .06)) { const e = pick(v); G.used.add(e.id); G.rally.push([e, 'bot']); pingTurn('me'); } else pingPoint('me', G.opp + ' bilemedi'); }, 1100 + rnd(1700)); } }
function pingPick(e) { if (G.crit.t(e) && !G.used.has(e.id)) { G.used.add(e.id); G.rally.push([e, 'me']); pingTurn('bot'); } else pingPoint('bot', e.name + ' uymuyor'); }
function pingPoint(w, msg) { stopClock(); G.sc[w === 'me' ? 0 : 1]++; toast(msg + (w === 'me' ? ' · sayı senin' : ' · sayı rakibin')); G.turn = null; pingRender(); later(pingServe, 1600); }
function pingRender() {
  app.innerHTML = vsH(G.sc[0], G.sc[1]) + clockH() + `<div class="qbox"><small>İLK 3 SAYIYI ALAN KAZANIR · TEKRAR YOK</small><b>${G.crit.l}</b></div>
  <div class="chips">${G.rally.slice(-8).map(([e, o]) => chip(e.name, o)).join('') || '<span class="hint">Henüz isim söylenmedi.</span>'}</div>` +
  (G.turn === 'me' ? '<p class="turn me">Sıra sende: uyan bir isim söyle</p>' + searchH(G.deck.ph) : `<p class="turn bot">${G.turn ? G.opp + ' düşünüyor…' : 'Yeni servis geliyor'}</p>`) + quitH; paintTime(); bindSearch(); }

/* ---------- Bingo ---------- */
function bingoStart() { const deck = DECKS[G.topic]; Object.assign(G, { deck, board: shuffle(deck.crit).slice(0, 9), mine: Array(9).fill(null), bot: new Set(), seq: shuffle(deck.ents), i: -1 }); bingoNext(); }
function bingoNext() { const m = G.mine.filter(Boolean).length, b = G.bot.size; if (m === 9 || b === 9 || G.i === 21) return duel(m, b); G.i++; G.e = G.seq[G.i]; bingoRender(); countdown(10, () => bingoPlace(-1)); }
function bingoPlace(i) { stopClock(); if (i >= 0) { if (!G.mine[i] && G.board[i].t(G.e)) G.mine[i] = G.e; else toast(G.e.name + ' bu kareye uymuyor'); }
  const f = [...G.board.keys()].filter(j => !G.bot.has(j) && G.board[j].t(G.e)); if (f.length && Math.random() < .6) G.bot.add(pick(f)); bingoNext(); }
function bingoRender() {
  app.innerHTML = vsH(G.mine.filter(Boolean).length, G.bot.size) + clockH() + `<div class="qbox"><small>KART ${G.i + 1}/22 · UYDUĞU BOŞ KAREYE YERLEŞTİR</small><b>${G.e.name}</b></div>
  <div class="bgrid">${G.board.map((c, i) => `<button class="cell ${G.mine[i] ? 'me' : ''}" data-act="bcell" data-i="${i}" ${G.mine[i] ? 'disabled style="opacity:1"' : ''}>${c.l}${G.mine[i] ? `<small>${G.mine[i].name}</small>` : ''}</button>`).join('')}</div>
  <div class="jok"><button class="jk" data-act="bpas">Pas<small>bu kartı geç</small></button></div>` + quitH; paintTime(); }

/* ---------- Numara Avı ---------- */
function numaraStart() { Object.assign(G, { deck: DECKS[G.topic], sc: [0, 0], round: 0, seen: new Set() }); numaraRound(); }
function numaraRound() { if (G.round === 5) return duel(G.sc[0], G.sc[1]); G.round++; G.g = pick(G.deck.guess); G.e = pick(G.deck.ents.filter(e => !G.seen.has(e))); G.seen.add(G.e); G.rev = null; numaraRender(); countdown(15, () => numaraGuess(null)); }
function numaraGuess(v) { if (G.rev) return; stopClock(); const t = G.e[G.g.k], vals = G.deck.ents.map(e => e[G.g.k]), lo = Math.min(...vals), span = Math.max(...vals) - lo;
  const b = Math.random() < .3 ? t : Math.max(lo, t + Math.round((Math.random() - .5) * span * .3)), dm = v == null ? Infinity : Math.abs(v - t), db = Math.abs(b - t);
  if (dm <= db) G.sc[0]++; if (db <= dm) G.sc[1]++; G.rev = { v, b, t, w: dm < db ? 'me' : db < dm ? 'bot' : '' }; numaraRender(); later(numaraRound, 3200); }
function numaraRender() { const r = G.rev;
  app.innerHTML = vsH(G.sc[0], G.sc[1]) + clockH() + `<div class="qbox"><small>TUR ${G.round}/5 · EN YAKIN TAHMİN TURU ALIR</small><b>${G.g.t(G.e)}</b></div>` +
  (r ? `<div class="cols three"><div class="qbox"><small>SEN</small><b class="num">${r.v ?? '–'}</b></div><div class="qbox"><small>DOĞRU</small><b class="num">${r.t}</b></div><div class="qbox"><small>${G.opp.toLocaleUpperCase('tr')}</small><b class="num">${r.b}</b></div></div>
    <p class="turn ${r.w || 'me'}">${r.w === 'me' ? 'Turu aldın' : r.w === 'bot' ? 'Turu kaybettin' : 'Berabere, ikiniz de puan aldınız'}</p>`
    : '<div class="row"><input id="g" class="inp num" type="number" inputmode="numeric" placeholder="Tahminin"><button class="btn" data-act="guess">Tahmin et</button></div>') + quitH;
  paintTime(); $('#g')?.focus(); }

/* ---------- 3-2-1 ---------- */
function ucStart() { Object.assign(G, { deck: DECKS[G.topic], stages: [], st: -1, sc: [0, 0], used: new Set(), onPick: ucPick }); ucStage(); }
function ucSpec(st) { const d = G.deck, C = d.crit, n = (...cs) => d.ents.filter(e => !G.used.has(e.id) && cs.every(c => c.t(e))).length, pairs = [];
  C.forEach((a, i) => C.slice(i + 1).forEach(b => pairs.push([a, b])));
  return st === 0 ? [3, [pick(C.filter(c => n(c) >= d.min * 5))], 1] : st === 1 ? [2, pick(pairs.filter(p => n(...p) >= 3 && n(...p) <= 30)), 2] : [1, pick(pairs.filter(p => n(...p) >= 1 && n(...p) <= 6)), 3]; }
function ucStage() { if (G.st === 2) return duel(G.sc[0], G.sc[1]); G.st++; G.stages[G.st] = ucSpec(G.st); G.tries = []; G.closed = false; ucRender(); countdown(25, ucClose); }
function ucPick(e) { const [need, cs, pt] = G.stages[G.st], ok = cs.every(c => c.t(e)) && !G.used.has(e.id); G.used.add(e.id); G.tries.push([e, ok]); if (ok) G.sc[0] += pt; if (G.tries.length === need) ucClose(); else ucRender(); }
function ucClose() { stopClock(); const [need, , pt] = G.stages[G.st]; let b = 0; for (let i = 0; i < need; i++) if (Math.random() < [.8, .6, .45][G.st]) b++;
  G.sc[1] += b * pt; toast(`${G.opp} bu turda ${b}/${need} bildi`); G.closed = true; ucRender(); later(ucStage, 2400); }
function ucRender() { const [need, cs, pt] = G.stages[G.st];
  app.innerHTML = vsH(G.sc[0], G.sc[1]) + clockH() + `<div class="qbox"><small>${need} TANE SAY · HER DOĞRU ${pt} PUAN · ${need} HAKKIN VAR</small><b>${cs.map(c => c.l).join(' + ')}</b></div>
  <div class="chips">${Array.from({ length: need }, (_, i) => G.tries[i] ? chip(G.tries[i][0].name, G.tries[i][1] ? 'ok' : 'no') : chip(i + 1 + '. cevap')).join('')}</div>` + (G.closed ? '' : searchH(G.deck.ph)) + quitH; paintTime(); bindSearch(); }

function azStart() { Object.assign(G, { list: pick([AZ1, AZ2]).map(([h, c, a]) => ({ h, c, a, s: 0 })), cur: 0, botN: 10 + rnd(8) }); azRender(); countdown(120, azEnd); }
function azNext() { const n = G.list.length; for (let k = 1; k <= n; k++) { const j = (G.cur + k) % n; if (!G.list[j].s) { G.cur = j; return azRender(); } } azEnd(); }

const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const dateTR = () => new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
const seedOf = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
function seeded(seed, fn) { let a = seed; RNG = () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; try { return fn(); } finally { RNG = Math.random; } }
function miss(q) { P.miss = [{ t: q.t, ctx: q.ctx, o: q.opts.map(x => x.l), c: q.c }, ...P.miss.filter(m => m.t !== q.t)].slice(0, 40); save(); }

  if (k === 3) { const e = pick(EVENTS); return { a: e.name, b: 'Milâdî ' + (want ? e.yil : e.yil + pick([-3, -2, -1, 1, 2, 3])) + ' yılında gerçekleşti', v: want, fix: 'M. ' + e.yil }; }
  const [t, c, ...w] = pick(Object.values(BANK).flat()); return { a: t, b: want ? c : pick(w), v: want, fix: c }; }
function dyStart() { Object.assign(G, { sc: 0, botN: 9 + rnd(8) }); countdown(60, () => duel(G.sc, G.botN, `<p class="hint">Sen ${G.sc}, ${G.opp} ${G.botN} doğru.</p>`)); dyNext(); }

function netHost(code, cb) {
  if (LOCAL) { const ch = new BroadcastChannel('im-' + code), cs = {};
    ch.onmessage = ev => { const m = ev.data; if (m.to !== 'host') return; let c = cs[m.from];
      if (!c) { c = cs[m.from] = { send: d => ch.postMessage({ to: m.from, d }), close() { ch.postMessage({ to: m.from, bye: 1 }); } }; cb.join(c); }
      if (m.bye) { delete cs[m.from]; c.onclose && c.onclose(); } else if (m.d) c.ondata && c.ondata(m.d); };
    setTimeout(cb.open, 0); return { close() { Object.values(cs).forEach(c => c.close()); ch.close(); } }; }
  const peer = new Peer(PREFIX + code);
  peer.on('open', cb.open); peer.on('error', e => cb.err(e.type));
  peer.on('connection', conn => { const c = { send: d => conn.send(d), close: () => conn.close() };
    conn.on('open', () => cb.join(c)); conn.on('data', d => c.ondata && c.ondata(d)); conn.on('close', () => c.onclose && c.onclose()); });
  return { close: () => peer.destroy() };
}
function netJoin(code, cb) {
  if (LOCAL) { const ch = new BroadcastChannel('im-' + code), from = myId(), c = { send: d => ch.postMessage({ to: 'host', from, d }) };
    ch.onmessage = ev => { const m = ev.data; if (m.to !== from) return; if (m.bye) c.onclose && c.onclose(); else c.ondata && c.ondata(m.d); };
    setTimeout(() => cb.open(c), 0); return { close() { ch.postMessage({ to: 'host', from, bye: 1 }); ch.close(); } }; }
  const peer = new Peer();
  peer.on('error', e => cb.err(e.type));
  peer.on('open', () => { const conn = peer.connect(PREFIX + code, { reliable: true, serialization: 'json' }), c = { send: d => conn.send(d) };
    conn.on('open', () => cb.open(c)); conn.on('data', d => c.ondata && c.ondata(d)); conn.on('close', () => c.onclose && c.onclose()); });
  return { close: () => peer.destroy() };

function mpNextP(i) { const g = S.g, n = S.players.length; do { i = (i + 1) % n; } while (!g.alive[i]); return i; }
